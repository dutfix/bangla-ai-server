<!DOCTYPE html>
<html lang="bn">
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
  <meta name="description" content="Bangla AI: বাংলায় কথা বলুন AI-এর সাথে।">
  <meta name="theme-color" content="#006A4E">
  <meta name="color-scheme" content="light dark">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Bangla AI">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Bangla AI</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #006A4E; }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background: #006A4E; z-index: 10; transition: opacity 300ms ease;
      font-family: system-ui, -apple-system, "Noto Sans Bengali", sans-serif;
    }
    #splash img {
      width: 120px; height: 120px; border-radius: 28px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .25);
      animation: pop 900ms ease-out both, breathe 2.4s ease-in-out 900ms infinite;
    }
    #splash .name { color: #fff; font-size: 22px; font-weight: 700; letter-spacing: .5px; }
    #splash .bar { width: 44px; height: 4px; border-radius: 2px; background: #F42A41; animation: grow 1.2s ease-in-out infinite alternate; }
    #splash.done { opacity: 0; pointer-events: none; }
    @keyframes pop { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes breathe { 50% { transform: scale(1.04); } }
    @keyframes grow { from { width: 24px; } to { width: 72px; } }
  </style>
</head>
<body>
  <div id="splash" aria-label="Bangla AI">
    <img src="splash-logo.png" alt="Bangla AI">
    <div class="name">Bangla AI</div>
    <div class="bar"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (!s) return;
      s.classList.add('done');
      setTimeout(function () { s.remove(); }, 400);
    });
  </script>
  <script src="pwa.js" defer></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
