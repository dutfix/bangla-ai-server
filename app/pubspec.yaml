name: omni_voice_call
description: "Bangla AI: chat and hands-free voice calls in Bangla. Answers come through the Bangla AI server; voices are the phone's Google Bangla voices."
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  material_ui: ^1.11.0
  cupertino_icons: ^1.0.8

  speech_to_text: ^7.5.0
  flutter_tts: ^4.2.5
  http: ^1.6.0
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  flutter_markdown_plus: ^1.0.12
  markdown: ^7.3.1
  highlight: ^0.7.0
  url_launcher: ^6.3.3
  android_intent_plus: ^6.1.0
  path_parsing: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/

  fonts:
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans.ttf
    - family: Noto Sans Bengali
      fonts:
        - asset: assets/fonts/NotoSansBengali.ttf
    - family: Anton
      fonts:
        - asset: assets/fonts/Anton-Regular.ttf
    - family: DM Mono
      fonts:
        - asset: assets/fonts/DMMono-Regular.ttf
        - asset: assets/fonts/DMMono-Medium.ttf
          weight: 500

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/logo.png
  min_sdk_android: 21
