# Render Blueprint: one free Node web service. The config is stored in a free
# Neon Postgres (set DATABASE_URL); see README.md for why not Render's own.
# Render dashboard > New > Blueprint > pick this repo.
services:
  - type: web
    name: bangla-ai-server
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Admin dashboard password. Render asks for it when you apply the Blueprint.
      - key: ADMIN_PASSWORD
        sync: false
      # Neon connection string (postgresql://...neon.tech/neondb?sslmode=verify-full)
      - key: DATABASE_URL
        sync: false
      # Random text that signs admin sign-in tokens.
      - key: TOKEN_SECRET
        generateValue: true
      # Initial values only: after the first start, edit them in the admin app.
      - key: OMNIROUTE_BASE_URL
        sync: false
      - key: OMNIROUTE_API_KEY
        sync: false
      - key: MODELS
        value: auto,auto/fast
      - key: DEFAULT_MODEL
        value: auto
      - key: VOICE_LOCALE
        value: bn-BD
      - key: VOICE_SPEED
        value: "1.0"
      - key: VOICE_PITCH
        value: "1.0"

